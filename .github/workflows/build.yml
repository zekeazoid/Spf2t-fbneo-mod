name: Build custom FBNeo Android ARM64

"on":
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone FBNeo libretro port
        run: |
          git clone --depth 1 https://github.com/libretro/FBNeo.git
          cd FBNeo
          echo "Building FBNeo commit: $(git rev-parse HEAD)"

      - name: Patch Puzzle Fighter CRCs and monkey win marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          driver = Path("FBNeo/src/burn/drv/capcom/d_cps2.cpp")
          s = driver.read_text(encoding="latin-1")
          start_marker = "static struct BurnRomInfo Spf2tRomDesc[] = {"
          end_marker = "STD_ROM_PICK(Spf2t)"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate Spf2tRomDesc block")
          block = s[start:end]
          changes = {
              "pzf.14m": "207c96cb",
              "pzf.16m": "723f651d",
              "pzf.18m": "9975c7ff",
              "pzf.20m": "4f411b00",
          }
          for rom, crc in changes.items():
              pattern = re.compile(r'(^[^\n]*"' + re.escape(rom) + r'"[^\n]*?0x)([0-9a-fA-F]{8})([^\n]*$)', re.M)
              block, n = pattern.subn(lambda m: m.group(1) + crc + m.group(3), block, count=1)
              if n != 1:
                  raise SystemExit("Could not patch Spf2t " + rom)
          s = s[:start] + block + s[end:]
          driver.write_text(s, encoding="latin-1")

          libretro = Path("FBNeo/src/burner/libretro/libretro.cpp")
          lr = libretro.read_text(encoding="latin-1")
          version_needle = 'sprintf(library_version, "v%x.%x.%x.%02x %s %s", nBurnVer >> 20, (nBurnVer >> 16) & 0x0F, (nBurnVer >> 8) & 0xFF, nBurnVer & 0xFF, GIT_DATE, GIT_VERSION);'
          version_replacement = 'sprintf(library_version, "ZEKE-MONKEY v%x.%x.%x.%02x %s %s", nBurnVer >> 20, (nBurnVer >> 16) & 0x0F, (nBurnVer >> 8) & 0xFF, nBurnVer & 0xFF, GIT_DATE, GIT_VERSION);'
          if version_needle not in lr:
              raise SystemExit("Could not patch core version marker")
          lr = lr.replace(version_needle, version_replacement, 1)

          video_needle = '\tvideo_cb(pBurnDraw, nGameWidth, nGameHeight, nBurnPitch);'
          video_replacement = '''\t// ZEKE TEST: monkey faces at Puzzle Fighter round-win marker positions.
\tif (pBurnDraw && strcmp(g_driver_name, "spf2t") == 0 && nBurnPitch > 0 && (nBurnBpp == 2 || nBurnBpp == 4) && nGameWidth >= 300 && nGameHeight >= 220 && nBurnPitch >= nGameWidth * nBurnBpp)
\t{
\t\tstatic const char* monkey[12] = {
\t\t\t"...111111...", "..12222221..", ".1233333321.", "123444444321",
\t\t\t"123414414321", "123444444321", "123433334321", ".1233553321.",
\t\t\t"..12333321..", "...122221...", "....1111....", "............"
\t\t};
\t\tUINT32 pal[6] = { 0 };
\t\tpal[1] = BurnHighCol(32, 16, 8, 0);
\t\tpal[2] = BurnHighCol(150, 72, 24, 0);
\t\tpal[3] = BurnHighCol(255, 184, 112, 0);
\t\tpal[4] = BurnHighCol(255, 244, 224, 0);
\t\tpal[5] = BurnHighCol(238, 76, 92, 0);
\t\tconst int monkey_x[2] = { (150 * nGameWidth) / 384, (222 * nGameWidth) / 384 };
\t\tconst int monkey_y = nGameHeight - 17;
\t\tfor (int which = 0; which < 2; which++) {
\t\t\tfor (int yy = 0; yy < 12; yy++) {
\t\t\t\tint py = monkey_y + yy;
\t\t\t\tif (py < 0 || py >= nGameHeight) continue;
\t\t\t\tUINT8* row = (UINT8*)pBurnDraw + (py * nBurnPitch);
\t\t\t\tfor (int xx = 0; xx < 12; xx++) {
\t\t\t\t\tchar c = monkey[yy][xx];
\t\t\t\t\tif (c == '.') continue;
\t\t\t\t\tint px = monkey_x[which] + xx;
\t\t\t\t\tif (px < 0 || px >= nGameWidth) continue;
\t\t\t\t\tUINT32 color = pal[c - '0'];
\t\t\t\t\tif (nBurnBpp == 4) ((UINT32*)row)[px] = color;
\t\t\t\t\telse ((UINT16*)row)[px] = (UINT16)color;
\t\t\t\t}
\t\t\t}
\t\t}
\t}

\tvideo_cb(pBurnDraw, nGameWidth, nGameHeight, nBurnPitch);'''
          if video_needle not in lr:
              raise SystemExit("Could not find video output call")
          lr = lr.replace(video_needle, video_replacement, 1)
          libretro.write_text(lr, encoding="latin-1")
          print("VERIFIED core marker: ZEKE-MONKEY")
          print("VERIFIED monkey win-marker patch")
          PY

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build ARM64 core
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd FBNeo/src/burner/libretro/jni
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_ABI=arm64-v8a -j2

      - name: Find core
        run: |
          set -euxo pipefail
          mkdir -p out
          CORE=$(find FBNeo/src/burner/libretro/jni -type f -path "*/arm64-v8a/*" -name "libretro.so" | head -n1)
          test -n "$CORE"
          cp "$CORE" out/fbneo_zeke_monkey_libretro_android_arm64.so
          file out/fbneo_zeke_monkey_libretro_android_arm64.so

      - name: Give me the core
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-android-arm64-zeke-monkey-v4-fixed
          path: out/fbneo_zeke_monkey_libretro_android_arm64.so
