name: Build custom FBNeo Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone FBNeo libretro source
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/libretro/FBNeo.git FBNeo
          cd FBNeo
          echo "FBNeo commit: $(git rev-parse HEAD)"

      - name: Accept WIN-01 Puzzle Fighter graphics ROMs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          driver = Path("FBNeo/src/burn/drv/capcom/d_cps2.cpp")
          s = driver.read_text(encoding="latin-1")
          start_marker = "static struct BurnRomInfo Spf2tRomDesc[] = {"
          end_marker = "STD_ROM_PICK(Spf2t)"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate Spf2tRomDesc block")

          block = s[start:end]
          changes = {
              "pzf.14m": "1377d496",
              "pzf.16m": "753fc470",
              "pzf.18m": "38c66c42",
              "pzf.20m": "796dc257",
          }
          for rom, crc in changes.items():
              pattern = re.compile(r'(^[^\n]*"' + re.escape(rom) + r'"[^\n]*?0x)([0-9a-fA-F]{8})([^\n]*$)', re.M)
              block, n = pattern.subn(lambda m: m.group(1) + crc + m.group(3), block, count=1)
              if n != 1:
                  raise SystemExit("Could not patch Spf2t " + rom)
              print("ACCEPT", rom, crc)

          s = s[:start] + block + s[end:]
          driver.write_text(s, encoding="latin-1")
          print("Only the four Spf2t graphics CRC entries were changed for WIN-01.")
          PY

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build ARM64 core
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd FBNeo/src/burner/libretro/jni
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_ABI=arm64-v8a -j2

      - name: Find core
        run: |
          set -euxo pipefail
          mkdir -p out
          CORE=$(find FBNeo/src/burner/libretro/jni -type f -path "*/arm64-v8a/*" -name "libretro.so" | head -n1)
          test -n "$CORE"
          cp "$CORE" out/fbneo_zeke_win01_v10_libretro_android_arm64.so
          file out/fbneo_zeke_win01_v10_libretro_android_arm64.so

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-android-arm64-zeke-win01-v10
          path: out/fbneo_zeke_win01_v10_libretro_android_arm64.so
