name: Build custom FBNeo Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone FBNeo libretro port
        run: |
          git clone --depth 1 https://github.com/libretro/FBNeo.git
          cd FBNeo
          echo "Building FBNeo commit: $(git rev-parse HEAD)"

      - name: Patch Puzzle Fighter CRCs and obvious ZEKE test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          driver = Path("FBNeo/src/burn/drv/capcom/d_cps2.cpp")
          s = driver.read_text(encoding="latin-1")

          start_marker = "static struct BurnRomInfo Spf2tRomDesc[] = {"
          end_marker = "STD_ROM_PICK(Spf2t)"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate Spf2tRomDesc block")

          block = s[start:end]
          changes = {
              "pzf.14m": "207c96cb",
              "pzf.16m": "723f651d",
              "pzf.18m": "9975c7ff",
              "pzf.20m": "4f411b00",
          }

          for rom, crc in changes.items():
              pattern = re.compile(
                  r'(^[^\n]*"' + re.escape(rom) +
                  r'"[^\n]*?0x)([0-9a-fA-F]{8})([^\n]*$)',
                  re.M,
              )
              block, n = pattern.subn(
                  lambda m: m.group(1) + crc + m.group(3),
                  block,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("Could not patch Spf2t " + rom)

          for rom, crc in changes.items():
              if not re.search(r'"' + re.escape(rom) + r'"[^\n]*0x' + crc, block, re.I):
                  raise SystemExit("Verification failed for " + rom)
              print("VERIFIED", rom, crc)

          s = s[:start] + block + s[end:]
          driver.write_text(s, encoding="latin-1")

          libretro = Path("FBNeo/src/burner/libretro/libretro.cpp")
          lr = libretro.read_text(encoding="latin-1")

          version_needle = 'sprintf(library_version, "v%x.%x.%x.%02x %s %s", nBurnVer >> 20, (nBurnVer >> 16) & 0x0F, (nBurnVer >> 8) & 0xFF, nBurnVer & 0xFF, GIT_DATE, GIT_VERSION);'
          version_replacement = 'sprintf(library_version, "ZEKE-NEGATIVE v%x.%x.%x.%02x %s %s", nBurnVer >> 20, (nBurnVer >> 16) & 0x0F, (nBurnVer >> 8) & 0xFF, nBurnVer & 0xFF, GIT_DATE, GIT_VERSION);'
          if version_needle not in lr:
              raise SystemExit("Could not patch core version marker")
          lr = lr.replace(version_needle, version_replacement, 1)

          video_needle = '\tvideo_cb(pBurnDraw, nGameWidth, nGameHeight, nBurnPitch);'
          video_replacement = '''\t// ZEKE TEST: make Puzzle Fighter unmistakably different by inverting every video byte.\n\t// This is display-only and does not change game logic.\n\tif (pBurnDraw && strcmp(g_driver_name, "spf2t") == 0)\n\t{\n\t\tfor (int y = 0; y < nGameHeight; y++)\n\t\t{\n\t\t\tUINT8* row = (UINT8*)pBurnDraw + (y * nBurnPitch);\n\t\t\tfor (int x = 0; x < nGameWidth * nBurnBpp; x++)\n\t\t\t\trow[x] ^= 0xff;\n\t\t}\n\t}\n\n\tvideo_cb(pBurnDraw, nGameWidth, nGameHeight, nBurnPitch);'''
          if video_needle not in lr:
              raise SystemExit("Could not find video output call")
          lr = lr.replace(video_needle, video_replacement, 1)

          libretro.write_text(lr, encoding="latin-1")
          print("VERIFIED core marker: ZEKE-NEGATIVE")
          print("VERIFIED Puzzle Fighter inverted-color video test")
          PY

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build ARM64 core
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd FBNeo/src/burner/libretro/jni
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_ABI=arm64-v8a \
            -j2

      - name: Find core
        run: |
          set -euxo pipefail
          mkdir -p out
          CORE=$(find FBNeo/src/burner/libretro/jni -type f -path "*/arm64-v8a/*" -name "libretro.so" | head -n1)
          test -n "$CORE"
          cp "$CORE" out/fbneo_zeke_negative_libretro_android_arm64.so
          file out/fbneo_zeke_negative_libretro_android_arm64.so

      - name: Give me the core
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-android-arm64-zeke-negative-v3
          path: out/fbneo_zeke_negative_libretro_android_arm64.so
