name: Build custom FBNeo Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone FBNeo libretro port
        run: git clone --depth 1 https://github.com/libretro/FBNeo.git

      - name: Patch Puzzle Fighter CRCs and title marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("FBNeo/src/burn/drv/capcom/d_cps2.cpp")
          s = p.read_text(encoding="latin-1")

          changes = {
              "pzf.14m": "207c96cb",
              "pzf.16m": "723f651d",
              "pzf.18m": "9975c7ff",
              "pzf.20m": "4f411b00"
          }

          for rom, crc in changes.items():
              pattern = re.compile(
                  r'(^[^\n]*"' + re.escape(rom) +
                  r'"[^\n]*?0x)([0-9a-fA-F]{8})([^\n]*$)',
                  re.M
              )
              s, n = pattern.subn(
                  lambda m: m.group(1) + crc + m.group(3),
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("Could not patch " + rom)
              print(f"Patched {rom} -> {crc}")

          old_title = "Super Puzzle Fighter II Turbo (USA 960620)"
          new_title = "Super Puzzle Fighter II Turbo - ZEKE TEST (USA 960620)"
          if old_title not in s:
              raise SystemExit("Could not find Puzzle Fighter title string")
          s = s.replace(old_title, new_title, 1)
          print("Added ZEKE TEST title marker")

          p.write_text(s, encoding="latin-1")
          PY

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build ARM64 core
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd FBNeo/src/burner/libretro/jni
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_ABI=arm64-v8a \
            -j2

      - name: Find core
        run: |
          set -euxo pipefail
          mkdir -p out
          CORE=$(find FBNeo/src/burner/libretro/jni -type f -path "*/arm64-v8a/*" -name "libretro.so" | head -n1)
          test -n "$CORE"
          cp "$CORE" out/fbneo_libretro_android_arm64.so
          file out/fbneo_libretro_android_arm64.so

      - name: Give me the core
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-android-arm64-zeke-test
          path: out/fbneo_libretro_android_arm64.so
